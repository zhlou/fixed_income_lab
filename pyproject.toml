[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fixed-income-lab"
version = "0.1.0"
description = "Interactive fixed-income lessons and tools for bond prices, risk, returns, and Treasury history."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/base.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
build = {file = ["requirements/build.txt"]}
web = {file = ["requirements/web.txt"]}
dev = {file = ["requirements/dev.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"filab.web" = ["templates/*.html", "content/*.md", "static/*", "static/vendor/katex/*", "static/vendor/katex/fonts/*"]

"filab.data" = ["fixtures/*.xml", "fixtures/*.json", "fixtures/*.csv"]
